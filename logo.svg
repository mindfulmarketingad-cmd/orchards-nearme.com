<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <style>
      .fist { fill: #e23b3b; stroke: #e23b3b; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Thumb -->
  <path class="fist" d="M 50 80 Q 40 60 45 40 Q 48 30 58 32 Q 65 35 62 55 Q 60 70 65 85"/>

  <!-- Index finger -->
  <path class="fist" d="M 70 75 Q 70 45 75 25 Q 78 12 88 15 Q 95 18 92 50 Q 90 70 95 95"/>

  <!-- Middle finger (tallest) -->
  <path class="fist" d="M 100 80 Q 102 40 105 15 Q 108 2 118 8 Q 125 12 122 55 Q 120 75 125 105"/>

  <!-- Ring finger -->
  <path class="fist" d="M 130 78 Q 135 48 138 28 Q 141 15 151 20 Q 158 24 154 55 Q 151 75 155 100"/>

  <!-- Pinky finger -->
  <path class="fist" d="M 158 82 Q 168 60 170 40 Q 172 28 182 32 Q 188 35 184 58 Q 180 75 180 95"/>

  <!-- Palm/fist base -->
  <ellipse class="fist" cx="105" cy="125" rx="45" ry="35"/>

  <!-- Wrist/arm -->
  <path class="fist" d="M 75 155 L 65 185 Q 62 195 72 198 Q 82 200 85 190 L 95 160"/>
  <path class="fist" d="M 135 155 L 145 185 Q 148 195 138 198 Q 128 200 125 190 L 115 160"/>
</svg>
